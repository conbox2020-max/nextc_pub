<svg xmlns="http://www.w3.org/2000/svg" width="101mm" height="84mm" viewBox="0 0 101 84"><image href="illust/도1-3_일러스트_v1.png" x="0" y="0" width="101" height="67.333"/><text x="3" y="6.5" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="3.351" font-weight="700" fill="#2A8F99" text-anchor="start">부동산</text><text x="3" y="10.3" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="400" fill="#4D4D4D" text-anchor="start">움직일 수 없는 재산</text><rect x="29.36" y="4.38" width="22.28" height="8.44" rx="1.2" fill="#fff" fill-opacity="0.92" stroke="#2A8F99" stroke-width="0.18"/><text x="40.5" y="8.031145833333332" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.999" font-weight="700" fill="#2A8F99" text-anchor="middle">건물</text><text x="40.5" y="11.276701388888888" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="700" fill="#4D4D4D" text-anchor="middle">땅에 붙어 있는 것</text><path d="M38.0 12.817534722222222 L35.0 17.5" stroke="#2A8F99" stroke-width="0.2" fill="none"/><circle cx="35.0" cy="17.5" r="0.5" fill="#2A8F99"/><rect x="24.66" y="37.78" width="10.67" height="8.44" rx="1.2" fill="#fff" fill-opacity="0.92" stroke="#2A8F99" stroke-width="0.18"/><text x="30.0" y="41.431145833333325" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.999" font-weight="700" fill="#2A8F99" text-anchor="middle">토지</text><text x="30.0" y="44.67670138888888" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="700" fill="#4D4D4D" text-anchor="middle">땅 자체</text><rect x="67.86" y="18.28" width="22.28" height="8.44" rx="1.2" fill="#fff" fill-opacity="0.92" stroke="#F5A21B" stroke-width="0.18"/><text x="79.0" y="21.931145833333336" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.999" font-weight="700" fill="#F5A21B" text-anchor="middle">동산</text><text x="79.0" y="25.176701388888887" font-family="'S
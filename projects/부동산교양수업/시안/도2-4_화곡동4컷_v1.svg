<svg xmlns="http://www.w3.org/2000/svg" width="101mm" height="106mm" viewBox="0 0 101 106"><svg x="0.00" y="0.00" width="49.50" height="32.43" viewBox="8 8 754 494"><image href="illust/도2-4_화곡동4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="3.2" cy="3.2" r="2.1" fill="#2A8F99"/><text x="3.20" y="4.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="0.00" y="36.03" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >전 주인이 집을 담보로 은행에서</text><text x="0.00" y="39.36" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >돈을 빌림 → 을구에 근저당권 기록</text><svg x="51.50" y="0.00" width="49.50" height="32.60" viewBox="778 8 750 494"><image href="illust/도2-4_화곡동4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="54.7" cy="3.2" r="2.1" fill="#D0312D"/><text x="54.70" y="4.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="51.50" y="36.20" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >전 주인이 서류를 위조해 근저당권을</text><text x="51.50" y="39.54" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >말소 → 빚은 그대로인데 기록만 지워짐</text><svg x="0.00" y="46.00" width="49.50" height="32.69" viewBox="8 518 754 498"><image href="illust/도2-4_화곡동4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="3.2" cy="49.2" r="2.1" fill="#2A8F99"/><text x="3.20" y="50.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="0.00" y="82.29" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >부부가 남은 근저당권이 없는 것을</text><text x="0.00" y="85.63" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >확인하고 집을 삼</text><svg x="51.50" y="46.00" width="49.50" height="32.87" viewBox="778 518 750 498"><image href="illust/도2-4_화곡동4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="54.7" cy="49.2" r="2.1" fill="#D0312D"/><text x="54.70" y="50.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="51.50" y="82.47" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >위조가 드러나 은행이 소송 → 판결로</text><text x="51.50" y="85.80" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >근저당권 기록이 되살아나 부부의 집이</text><text x="51.50" y="89.14" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >전 주인의 빚을 담보하게 됨</text><rect x="20.50" y="66.20" width="28.00" height="11.40" rx="1" fill="#fff" stroke="#4D4D4D" stroke-width="0.25" /><text x="21.70" y="69.20" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="700" fill="#4D4D4D" text-anchor="start" >말소사항 포함으로 발급</text><text x="21.70" y="72.60" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >근저당권설정</text><path d="M21.50 71.40 L36.70 71.40" stroke="#D0312D" stroke-width="0.3"/><text x="21.70" y="76.00" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >말소 20○○.○.○</text><ellipse cx="33.40" cy="75.10" rx="6.6" ry="2.2" fill="none" stroke="#D0312D" stroke-width="0.3"/><text x="50.50" y="99.50" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="3.528" font-weight="700" fill="#4D4D4D" text-anchor="middle" >기록이 지워졌다고 빚까지 사라진 것은 아니에요.</text><text x="0.00" y="104.30" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="300" fill="#4D4D4D" text-anchor="start" >• 실제 서류가 아닌 설명용 재구성. 2017년 매입, 2022년 대법원 확정 사건(본문 참조).</text></svg>
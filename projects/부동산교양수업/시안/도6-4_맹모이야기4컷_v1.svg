<svg xmlns="http://www.w3.org/2000/svg" width="101mm" height="109mm" viewBox="0 0 101 109"><svg x="0.00" y="0.00" width="49.50" height="32.43" viewBox="8 8 754 494"><image href="illust/도6-4_맹모4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="3.2" cy="3.2" r="2.1" fill="#2A8F99"/><text x="3.20" y="4.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="0.00" y="36.03" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="700" fill="#4D4D4D" text-anchor="start" >무덤 가까이 살 때</text><text x="0.00" y="39.43" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >장례 치르는 모습을 흉내 내며 놀았다</text><svg x="51.50" y="0.00" width="49.50" height="32.60" viewBox="778 8 750 494"><image href="illust/도6-4_맹모4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="54.7" cy="3.2" r="2.1" fill="#2A8F99"/><text x="54.70" y="4.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="51.50" y="36.20" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="700" fill="#4D4D4D" text-anchor="start" >시장 가까이 살 때</text><text x="51.50" y="39.60" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >물건을 사고파는 모습을 흉내 냈다</text><svg x="0.00" y="44.00" width="49.50" height="32.69" viewBox="8 518 754 498"><image href="illust/도6-4_맹모4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="3.2" cy="47.2" r="2.1" fill="#2A8F99"/><text x="3.20" y="48.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="0.00" y="80.29" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="700" fill="#4D4D4D" text-anchor="start" >학교 가까이 살 때</text><text x="0.00" y="83.69" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >예절을 따라 하며 놀자 그곳에 머물렀다</text><svg x="51.50" y="44.00" width="49.50" height="32.87" viewBox="778 518 750 498"><image href="illust/도6-4_맹모4컷_v1.png" x="0" y="0" width="1536" height="1024"/></svg><circle cx="54.7" cy="47.2" r="2.1" fill="#F5A21B"/><text x="54.70" y="48.25" font-family="'DIN 2014','NanumSquareRound',sans-serif" font-size="2.822" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="51.50" y="80.47" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="700" fill="#4D4D4D" text-anchor="start" >짜던 베를 끊으며</text><text x="51.50" y="83.87" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >배움을 그만두는 것은 이와 같다고 가르쳤다</text><text x="0.00" y="89.80" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="700" fill="#2A8F99" text-anchor="start" >①~③ 맹모삼천지교(孟母三遷之敎)</text><text x="51.50" y="89.80" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="700" fill="#F5A21B" text-anchor="start" >④ 맹모단기지교(孟母斷機之敎)</text><text x="50.50" y="97.50" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="3.528" font-weight="700" fill="#4D4D4D" text-anchor="middle" >맹자의 어머니 이야기는 무엇을 가르치려 했을까?</text><text x="0.00" y="102.30" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="300" fill="#4D4D4D" text-anchor="start" xml:space="preserve">• 맹자가 살던 때보다 200여 년 뒤 한나라 때의 『열녀전』 등에 전하는 옛이야기를</text><text x="0.00" y="105.70" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="300" fill="#4D4D4D" text-anchor="start" xml:space="preserve">  재구성한 그림. 실제 이사 기록이 아니다.</text></svg>
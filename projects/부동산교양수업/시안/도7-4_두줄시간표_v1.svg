" y="75.20" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.646" font-weight="700" fill="#fff" text-anchor="middle" >⑤ 잔금 때: 전세자금대출 4,000만 원 → 집주인 계좌</text><text x="2.00" y="81.40" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >계약금 1,000만 원 = 주하가 준비한 500만 원 + 부모님이 보탠 500만 원</text><text x="50.50" y="89.00" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="3.528" font-weight="700" fill="#4D4D4D" text-anchor="middle" >주하의 계약, 순서대로 보기</text><text x="0.00" y="93.80" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="300" fill="#4D4D4D" text-anchor="start" xml:space="preserve">• 가상 이야기의 설정. 대출·반환보증의 심사 결과는 실제 상품의 자격이나 한도를</text><text x="0.00" y="97.20" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="300" fill="#4D4D4D" text-anchor="start" xml:space="preserve">  뜻하지 않는다. 막대 길이는 금액에 비례한다.</text></svg>
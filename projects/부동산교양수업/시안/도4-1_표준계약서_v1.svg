<svg xmlns="http://www.w3.org/2000/svg" width="101mm" height="156mm" viewBox="0 0 101 156"><rect x="0.00" y="0.00" width="72.39" height="4.60" rx="0.8" fill="#666666" stroke="none" stroke-width="0" /><text x="36.20" y="3.25" font-family="'Sandoll 스터디윗미','NanumSquareRound',sans-serif" font-size="2.469" font-weight="700" fill="#fff" text-anchor="middle" >주택임대차표준계약서 항목 순서를 참고해 간추린 가상 계약서</text><rect x="0.00" y="6.50" width="72.00" height="132.18" rx="0" fill="#FAFAFA" stroke="#666666" stroke-width="0.25" /><text x="36.00" y="12.00" font-family="'Sandoll 고딕Neo1','NanumGothic',sans-serif" font-size="3.175" font-weight="700" fill="#4D4D4D" text-anchor="middle" >주택 임대차 계약서</text><text x="3.00" y="17.00" font-family="'Sandoll 고딕Neo1','NanumGothic',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >임대인(○○○)과 임차인(○○○)은 아래와 같이</text><text x="3.00" y="20.26" font-family="'Sandoll 고딕Neo1','NanumGothic',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >임대차 계약을 체결한다.</text><text x="2.00" y="25.60" font-family="'Sandoll 고딕Neo1','NanumGothic',sans-serif" font-size="2.646" font-weight="700" fill="#4D4D4D" text-anchor="start" >[임차주택의 표시]</text><rect x="2.00" y="27.00" width="15.00" height="5.66" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="0.15" /><rect x="17.00" y="27.00" width="53.00" height="5.66" rx="0" fill="#fff" stroke="#666666" stroke-width="0.15" /><text x="9.50" y="30.20" font-family="'Sandoll 고딕Neo1','NanumGothic',sans-serif" font-size="2.469" font-weight="700" fill="#4D4D4D" text-anchor="middle" >소재지</text><text x="18.50" y="30.20" font-family="'Sandoll 고딕Neo1','NanumGothic',sans-serif" font-size="2.469" font-weight="400" fill="#4D4D4D" text-anchor="start" >가람시 새봄로 ○○, ○○○호</text><rect x="2.00" y="32.66" width="15.00" height="5.66" rx="0" fill="#E6E6E6" stroke="#666666" stroke-width="0.15" /><rect x="17.00" y="32.66" width="53.00" height="5.66" rx="0" fill="#fff" stroke="#666666" stroke-width="0.15"